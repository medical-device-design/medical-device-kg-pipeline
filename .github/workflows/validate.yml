name: validate

# Layer 1 of the maintenance bot: mechanical enforcement of the converter
# standard + structure rules, with diagnostics collected on every run so
# troubleshooting is fast. See docs/ci-and-monitoring.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC weekly health run
  workflow_dispatch:
    inputs:
      run_smoke:
        description: "Also run the UDI smoke (fetch 1 partition + transform + full gate)"
        type: boolean
        default: false

jobs:
  # ---- Fast checks: run on every PR and push. No FDA data needed. ----
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python self-tests (iri / common / distribution_parser)
        run: |
          mkdir -p _diag
          rc=0
          for f in pipeline/iri.py pipeline/common.py pipeline/distribution_parser.py; do
            echo "== $f ==" | tee -a _diag/selftests.log
            python3 "$f" 2>&1 | tee -a _diag/selftests.log || rc=1
          done
          exit $rc

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Apache Jena
        run: |
          curl -fsSL -o jena.tgz https://dlcdn.apache.org/jena/binaries/apache-jena-5.2.0.tar.gz
          tar xzf jena.tgz
          echo "$PWD/apache-jena-5.2.0/bin" >> "$GITHUB_PATH"

      - name: Validate ontology + shapes (riot)
        run: |
          riot --validate ontology/*.ttl ontology/shapes/*.ttl 2>&1 | tee _diag/riot-ontology.log

      - name: Structure lint
        run: bash scripts/structure_lint.sh 2>&1 | tee _diag/structure-lint.log

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "run: checks"
            echo "date_utc: $(date -u +%FT%TZ)"
            echo "git_sha: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "event: $GITHUB_EVENT_NAME"
            echo "python: $(python3 -V 2>&1)"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "riot: $(riot --version 2>&1 | head -1)"
          } > _diag/env.txt
          cat _diag/env.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-checks-${{ github.run_number }}
          path: _diag/
          retention-days: 30

  # ---- Smoke: nightly/weekly + manual. Real fetch -> transform -> full gate. ----
  smoke:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Apache Jena
        run: |
          curl -fsSL -o jena.tgz https://dlcdn.apache.org/jena/binaries/apache-jena-5.2.0.tar.gz
          tar xzf jena.tgz
          echo "$PWD/apache-jena-5.2.0/bin" >> "$GITHUB_PATH"

      - name: UDI smoke - fetch 1 partition, transform 500 records
        run: |
          mkdir -p _diag out
          python3 pipeline/udi/fetch_udi.py --output downloads/udi --max-partitions 1 2>&1 | tee _diag/fetch.log
          python3 pipeline/udi/udi_to_rdf.py --input downloads/udi --output out/udi-smoke.ttl --limit 500 2>&1 | tee _diag/transform.log

      - name: Run the gate (validate.sh)
        run: bash scripts/validate.sh out 2>&1 | tee _diag/validate.log

      - name: Collect diagnostics
        if: always()
        run: |
          riot --count out/*.ttl > _diag/triple-counts.txt 2>&1 || true
          {
            echo "run: smoke"
            echo "date_utc: $(date -u +%FT%TZ)"
            echo "git_sha: $GITHUB_SHA"
            echo "event: $GITHUB_EVENT_NAME"
            echo "riot: $(riot --version 2>&1 | head -1)"
          } > _diag/env.txt
          cat _diag/env.txt _diag/triple-counts.txt

      - name: Upload diagnostics + sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-smoke-${{ github.run_number }}
          path: |
            _diag/
            out/udi-smoke.ttl
          retention-days: 30
